<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">

<title>Kama AI</title>

<style>
:root{
    --bg:#08090d;
    --sidebar:#0d0f15;
    --panel:#12151d;
    --panel2:#181b24;
    --border:#292d38;
    --text:#f5f7ff;
    --muted:#858b9c;
    --purple:#8b5cf6;
    --purple2:#6366f1;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
}

body{
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    color:var(--text);

    background:
        radial-gradient(
            circle at 50% -15%,
            #5225a844,
            transparent 40%
        ),
        var(--bg);

    overflow:hidden;
}

button,
textarea{
    font-family:inherit;
}

.app{
    width:100%;
    height:100dvh;
    display:flex;
}


/* ================= SIDEBAR ================= */

.sidebar{
    width:275px;
    height:100%;

    flex-shrink:0;

    display:flex;
    flex-direction:column;

    padding:14px;

    background:
        linear-gradient(
            180deg,
            #101219,
            #0a0c11
        );

    border-right:1px solid var(--border);

    z-index:100;
}

.sidebar-brand{
    display:flex;
    align-items:center;
    gap:10px;

    padding:8px 7px 20px;
}

.sidebar-logo,
.logo{
    display:grid;
    place-items:center;

    background:
        linear-gradient(
            135deg,
            #a78bfa,
            #7c3aed,
            #4f46e5
        );

    box-shadow:
        0 0 25px #8b5cf655;
}

.sidebar-logo{
    width:36px;
    height:36px;
    border-radius:12px;
}

.sidebar-title{
    font-size:17px;
    font-weight:700;
}

.sidebar-title span,
.header-name span{
    color:#a78bfa;
}

.new-chat{
    width:100%;

    padding:12px;

    border:1px solid #343846;
    border-radius:12px;

    background:#181b23;
    color:#fff;

    text-align:left;
    font-size:13px;
    font-weight:600;

    cursor:pointer;

    transition:.2s;
}

.new-chat:hover{
    background:#222631;
    border-color:#514d69;
}

.new-chat:active{
    transform:scale(.98);
}

.recent-title{
    margin:24px 8px 8px;

    color:#666c7c;

    font-size:10px;
    font-weight:700;

    letter-spacing:1px;
}

.recent-list{
    flex:1;
    overflow-y:auto;
}

.recent-list::-webkit-scrollbar{
    width:4px;
}

.recent-list::-webkit-scrollbar-thumb{
    background:#292d38;
    border-radius:10px;
}

.recent-item{
    display:flex;
    align-items:center;

    gap:9px;

    width:100%;

    padding:10px;

    margin-bottom:3px;

    border-radius:10px;

    color:#aeb3c2;

    font-size:13px;

    cursor:pointer;

    transition:.18s;
}

.recent-item:hover{
    background:#191c24;
    color:white;
}

.recent-item.active{
    background:#211d31;
    color:#fff;
}

.recent-icon{
    color:#8b5cf6;
}

.recent-name{
    flex:1;

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;
}

.delete-chat{
    width:24px;
    height:24px;

    border:0;
    border-radius:7px;

    background:transparent;

    color:#6c7281;

    cursor:pointer;

    opacity:0;

    font-size:16px;
}

.recent-item:hover .delete-chat{
    opacity:1;
}

.delete-chat:hover{
    background:#30202a;
    color:#ff6b81;
}

.empty-recent{
    padding:10px 8px;

    color:#555b69;

    font-size:12px;
    line-height:1.6;
}

.profile{
    display:flex;
    align-items:center;

    gap:10px;

    padding-top:12px;

    border-top:1px solid var(--border);
}

.profile-avatar{
    width:34px;
    height:34px;

    display:grid;
    place-items:center;

    border-radius:50%;

    background:#191c24;

    border:1px solid #343946;
}

.profile-name{
    font-size:12px;
    font-weight:600;
}

.profile-sub{
    color:#666c7a;
    font-size:10px;
}


/* ================= MAIN ================= */

.main{
    position:relative;

    flex:1;
    min-width:0;

    height:100%;

    display:flex;
    flex-direction:column;
}

header{
    height:62px;

    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px;

    background:#0b0d12dd;

    border-bottom:1px solid var(--border);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    z-index:20;
}

.header-left{
    display:flex;
    align-items:center;
    gap:10px;
}

.mobile-menu{
    display:none;

    width:36px;
    height:36px;

    border:0;
    background:transparent;

    color:white;

    font-size:22px;

    cursor:pointer;
}

.logo{
    width:34px;
    height:34px;

    border-radius:11px;

    font-size:17px;
}

.header-name{
    font-size:16px;
    font-weight:700;
}

.online{
    display:flex;
    align-items:center;
    gap:6px;

    color:#777d8c;
    font-size:10px;
}

.online-dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:#22c55e;

    box-shadow:0 0 10px #22c55e;
}


/* ================= CHAT ================= */

.chat-container{
    position:relative;

    flex:1;
    min-height:0;

    width:100%;
    max-width:900px;

    margin:auto;

    display:flex;
    flex-direction:column;
}

.chat-messages{
    flex:1;

    overflow-y:auto;

    padding:
        28px
        18px
        150px;

    scroll-behavior:smooth;
}

.chat-messages::-webkit-scrollbar{
    width:5px;
}

.chat-messages::-webkit-scrollbar-thumb{
    background:#292d38;
    border-radius:10px;
}


/* ================= WELCOME ================= */

.welcome{
    min-height:55vh;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    text-align:center;

    padding:25px;
}

.welcome-logo{
    width:76px;
    height:76px;

    display:grid;
    place-items:center;

    margin-bottom:22px;

    border-radius:25px;

    background:
        linear-gradient(
            135deg,
            #a78bfa,
            #7c3aed,
            #4f46e5
        );

    box-shadow:
        0 0 30px #8b5cf655,
        0 0 90px #8b5cf622;

    font-size:32px;

    animation:float 4s ease-in-out infinite;
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-7px);
    }
}

.welcome h1{
    font-size:28px;
    letter-spacing:-1px;

    margin-bottom:7px;
}

.welcome p{
    color:var(--muted);
    font-size:14px;
}


/* ================= MESSAGES ================= */

.message{
    width:100%;
    max-width:780px;

    margin:0 auto 18px;

    padding:14px 17px;

    border-radius:18px;

    font-size:15px;
    line-height:1.65;

    overflow-wrap:anywhere;

    animation:messageIn .2s ease;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(7px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.message p{
    white-space:pre-line;
    margin:0;
    overflow-wrap:anywhere;
}

.user-message{
    width:fit-content;
    max-width:82%;

    margin-left:auto;

    background:
        linear-gradient(
            135deg,
            #2b2442,
            #211d32
        );

    border:1px solid #40365d;

    box-shadow:0 7px 25px #0004;
}

.assistant-message{
    background:
        linear-gradient(
            135deg,
            #151821,
            #11131a
        );

    border:1px solid #292d38;

    box-shadow:0 7px 25px #0003;
}

.assistant-message::before{
    content:"✦";

    width:27px;
    height:27px;

    display:grid;
    place-items:center;

    margin-bottom:8px;

    border-radius:9px;

    background:
        linear-gradient(
            135deg,
            #8b5cf6,
            #4f46e5
        );

    font-size:12px;

    box-shadow:0 0 13px #8b5cf644;
}


/* ================= INPUT ================= */

.message-input{
    position:fixed;

    bottom:0;

    left:calc(
        275px + (100% - 275px) / 2
    );

    transform:translateX(-50%);

    width:min(
        900px,
        calc(100% - 275px)
    );

    padding:
        12px
        15px
        calc(12px + env(safe-area-inset-bottom));

    display:flex;

    align-items:flex-end;

    background:
        linear-gradient(
            transparent,
            #08090d 38%
        );

    z-index:30;
}

#user-input{
    width:100%;

    min-height:52px;
    max-height:150px;

    resize:none;

    outline:none;

    padding:
        15px
        55px
        15px
        17px;

    border:1px solid #303440;
    border-radius:18px;

    background:#151720f5;

    color:white;

    font-size:15px;
    line-height:1.4;

    box-shadow:0 10px 40px #0009;

    backdrop-filter:blur(20px);

    transition:.2s;
}

#user-input:focus{
    border-color:#6d5ab2;

    box-shadow:
        0 0 0 3px #8b5cf615,
        0 10px 40px #0009;
}

#user-input::placeholder{
    color:#707686;
}

#user-input:disabled{
    opacity:.6;
}

#send-button{
    position:absolute;

    right:25px;
    bottom:22px;

    width:40px;
    height:40px;

    border:0;
    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            #9b7bff,
            #6948e8
        );

    color:white;

    font-size:20px;

    cursor:pointer;

    box-shadow:0 5px 20px #7c3aed55;

    transition:.15s;
}

#send-button:hover{
    transform:scale(1.06);
}

#send-button:active{
    transform:scale(.92);
}

#send-button:disabled{
    opacity:.45;
    cursor:not-allowed;
}


/* ================= TYPING ================= */

.typing-indicator{
    display:none;

    position:fixed;

    left:50%;
    bottom:92px;

    transform:translateX(-50%);

    padding:8px 14px;

    border-radius:30px;

    background:#171923ee;

    border:1px solid #303440;

    color:#9298a8;

    font-size:11px;

    backdrop-filter:blur(15px);

    z-index:40;
}

.typing-indicator.visible{
    display:block;
}


/* ================= MOBILE ================= */

@media(max-width:700px){

    .sidebar{
        position:fixed;

        top:0;
        bottom:0;
        left:-290px;

        width:280px;

        transition:left .25s ease;

        box-shadow:15px 0 50px #000b;
    }

    .sidebar.open{
        left:0;
    }

    .mobile-menu{
        display:block;
    }

    header{
        height:58px;
        padding:0 12px;
    }

    .chat-messages{
        padding:
            20px
            11px
            145px;
    }

    .message{
        font-size:14px;
        padding:13px 14px;
        border-radius:17px;
    }

    .user-message{
        max-width:88%;
    }

    .welcome{
        min-height:60vh;
    }

    .welcome-logo{
        width:67px;
        height:67px;

        border-radius:22px;

        font-size:28px;
    }

    .welcome h1{
        font-size:23px;
    }

    .welcome p{
        font-size:13px;
    }

    .message-input{
        left:0;

        transform:none;

        width:100%;

        padding:
            9px
            10px
            calc(9px + env(safe-area-inset-bottom));
    }

    #user-input{
        min-height:50px;
        border-radius:17px;

        padding:
            14px
            50px
            14px
            15px;
    }

    #send-button{
        right:19px;
        bottom:19px;

        width:38px;
        height:38px;
    }
}

@media(max-width:360px){

    .header-name{
        font-size:14px;
    }

    .online{
        display:none;
    }

    .welcome h1{
        font-size:21px;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">

    <div class="sidebar-brand">

        <div class="sidebar-logo">
            ✦
        </div>

        <div class="sidebar-title">
            Kama <span>AI</span>
        </div>

    </div>

    <button
        class="new-chat"
        id="new-chat-button"
    >
        ＋ &nbsp; Chat baru
    </button>

    <div class="recent-title">
        RECENT
    </div>

    <div
        class="recent-list"
        id="recent-list"
    ></div>

    <div class="profile">

        <div class="profile-avatar">
            👤
        </div>

        <div>
            <div class="profile-name">
                Kama User
            </div>

            <div class="profile-sub">
                Kama AI
            </div>
        </div>

    </div>

</aside>


<!-- MAIN -->
<main class="main">

<header>

    <div class="header-left">

        <button
            class="mobile-menu"
            id="mobile-menu"
            aria-label="Menu"
        >
            ☰
        </button>

        <div class="logo">
            ✦
        </div>

        <div class="header-name">
            Kama <span>AI</span>
        </div>

    </div>

    <div class="online">
        <span class="online-dot"></span>
        Online
    </div>

</header>


<div class="chat-container">

    <div
        id="chat-messages"
        class="chat-messages"
    ></div>

    <div
        class="typing-indicator"
        id="typing-indicator"
    >
        Kama AI sedang berpikir...
    </div>

    <div class="message-input">

        <textarea
            id="user-input"
            placeholder="Tanyakan sesuatu..."
            rows="1"
            autocomplete="off"
        ></textarea>

        <button
            id="send-button"
            aria-label="Kirim"
        >
            ↑
        </button>

    </div>

</div>

</main>
</div>


<script>

/* =====================================================
   KAMA AI — ALL-IN-ONE
===================================================== */

const STORAGE_KEY = "kama_ai_chats_v2";

const chatMessages =
    document.getElementById("chat-messages");

const userInput =
    document.getElementById("user-input");

const sendButton =
    document.getElementById("send-button");

const typingIndicator =
    document.getElementById("typing-indicator");

const sidebar =
    document.getElementById("sidebar");

const recentList =
    document.getElementById("recent-list");

const mobileMenu =
    document.getElementById("mobile-menu");

const newChatButton =
    document.getElementById("new-chat-button");


let isProcessing = false;

let currentChatId =
    "chat_" + Date.now();


let chatHistory = [];


/* =====================================================
   STORAGE
===================================================== */

function getChats(){

    try{

        return JSON.parse(
            localStorage.getItem(STORAGE_KEY)
            || "[]"
        );

    }catch{

        return [];

    }
}


function saveChats(chats){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(chats)
    );

}


/* =====================================================
   SAFE HTML
===================================================== */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   NEW CHAT
===================================================== */

function createNewChat(){

    if(isProcessing) return;

    currentChatId =
        "chat_" + Date.now();

    chatHistory = [];

    renderChat();

    closeSidebar();

    userInput.value = "";

    userInput.style.height = "auto";

    userInput.focus();

}


/* =====================================================
   RENDER CHAT
===================================================== */

function renderChat(){

    chatMessages.innerHTML = "";

    if(chatHistory.length === 0){

        chatMessages.innerHTML = `

            <div class="welcome">

                <div class="welcome-logo">
                    ✦
                </div>

                <h1>
                    Apa yang bisa saya bantu?
                </h1>

                <p>
                    Tanyakan apa saja kepada Kama AI.
                </p>

            </div>

        `;

        return;
    }


    chatHistory.forEach(message => {

        addMessageToDOM(
            message.role,
            message.content
        );

    });

}


/* =====================================================
   ADD MESSAGE
===================================================== */

function addMessageToDOM(
    role,
    content
){

    const messageEl =
        document.createElement("div");

    messageEl.className =
        "message " +
        (
            role === "user"
            ? "user-message"
            : "assistant-message"
        );


    const p =
        document.createElement("p");


    p.textContent = content;


    messageEl.appendChild(p);

    chatMessages.appendChild(messageEl);


    chatMessages.scrollTop =
        chatMessages.scrollHeight;


    return messageEl;

}


/* =====================================================
   SAVE CURRENT CHAT
===================================================== */

function saveCurrentChat(){

    if(chatHistory.length === 0)
        return;


    const firstUser =
        chatHistory.find(
            m => m.role === "user"
        );


    if(!firstUser)
        return;


    let title =
        firstUser.content
            .replace(/\s+/g," ")
            .trim();


    if(title.length > 45){

        title =
            title.substring(0,45)
            + "...";

    }


    let chats = getChats();


    chats =
        chats.filter(
            chat =>
                chat.id !== currentChatId
        );


    chats.unshift({

        id:currentChatId,

        title:title,

        messages:chatHistory,

        updated:Date.now()

    });


    chats =
        chats.slice(0,30);


    saveChats(chats);

    renderRecent();

}


/* =====================================================
   LOAD CHAT
===================================================== */

function loadChat(id){

    if(isProcessing) return;


    const chats =
        getChats();


    const chat =
        chats.find(
            item =>
                item.id === id
        );


    if(!chat) return;


    currentChatId = chat.id;

    chatHistory =
        Array.isArray(chat.messages)
        ? chat.messages
        : [];


    renderChat();

    renderRecent();

    closeSidebar();

    userInput.focus();

}


/* =====================================================
   DELETE CHAT
===================================================== */

function deleteChat(
    id,
    event
){

    event.stopPropagation();


    if(isProcessing) return;


    const chats =
        getChats().filter(
            chat =>
                chat.id !== id
        );


    saveChats(chats);


    if(id === currentChatId){

        createNewChat();

    }else{

        renderRecent();

    }

}


/* =====================================================
   RECENT
===================================================== */

function renderRecent(){

    const chats =
        getChats();


    if(chats.length === 0){

        recentList.innerHTML = `

            <div class="empty-recent">

                Belum ada percakapan.<br>

                Mulai chat pertama kamu ✦

            </div>

        `;

        return;

    }


    recentList.innerHTML =
        chats.map(chat => `

            <div
                class="recent-item
                ${chat.id === currentChatId ? "active" : ""}"
                data-id="${escapeHTML(chat.id)}"
            >

                <span class="recent-icon">
                    ✦
                </span>

                <span class="recent-name">
                    ${escapeHTML(chat.title)}
                </span>

                <button
                    class="delete-chat"
                    data-delete="${escapeHTML(chat.id)}"
                    aria-label="Hapus"
                >
                    ×
                </button>

            </div>

        `).join("");


    recentList
        .querySelectorAll(".recent-item")
        .forEach(item => {

            item.addEventListener(
                "click",
